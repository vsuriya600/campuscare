<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>
<body>

<div class="auth-container">

    <div class="auth-box">

        <h2>
            CampusCare Login
        </h2>

        <input type="text"
               id="institutional_id"
               class="form-control"
               placeholder="Institutional ID">

        <input type="password"
               id="password"
               class="form-control"
               placeholder="Password">

        <button class="btn btn-primary"
                onclick="loginUser()">

            Login

        </button>

        <p id="login_message"
           class="mt-3 text-center"></p>

        <p class="text-center mt-3">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </p>

    </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
